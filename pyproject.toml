[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "code-review-agent"
version = "0.1.0"
description = "Autonomous Code Review Agent with Memory"
requires-python = ">=3.10"
dependencies = [
    "chromadb==1.5.2",
    "sentence-transformers==5.2.3",
    "pydantic==2.12.5",
    "langgraph==1.0.10",
    "anthropic==0.84.0",
    "groq==1.7.0",
    "PyGithub==2.8.1",
    "fastapi==0.135.1",
    "uvicorn==0.41.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "pytest-mock==3.15.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"
