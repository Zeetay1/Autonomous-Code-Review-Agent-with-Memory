<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Code Review Agent Dashboard</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 1rem auto; padding: 0 1rem; }
    h1 { font-size: 1.5rem; }
    section { margin: 1.5rem 0; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 0.4rem 0.6rem; text-align: left; }
    th { background: #f5f5f5; }
    #stats { display: flex; gap: 1rem; flex-wrap: wrap; }
    #stats div { background: #f5f5f5; padding: 0.8rem 1.2rem; border-radius: 6px; }
    #stats div strong { display: block; font-size: 1.2rem; }
  </style>
</head>
<body>
  <h1>Code Review Agent Dashboard</h1>
  <section>
    <h2>Stats</h2>
    <div id="stats">
      <div><strong id="total-comments">-</strong> Total comments</div>
      <div><strong id="blocking">-</strong> Blocking</div>
      <div><strong id="warnings">-</strong> Warnings</div>
      <div><strong id="nits">-</strong> Nits</div>
      <div><strong id="pattern-rejections">-</strong> Pattern rejections (total)</div>
    </div>
  </section>
  <section>
    <h2>Recent reviews</h2>
    <table>
      <thead><tr><th>PR</th><th>Comments</th><th>Created</th></tr></thead>
      <tbody id="reviews"></tbody>
    </table>
  </section>
  <script>
    async function load() {
      try {
        const [reviewsRes, statsRes] = await Promise.all([
          fetch('/api/reviews'),
          fetch('/api/stats')
        ]);
        const reviews = await reviewsRes.json();
        const stats = await statsRes.json();
        const sev = stats.by_severity || {};
        document.getElementById('total-comments').textContent =
          (sev.blocking || 0) + (sev.warning || 0) + (sev.nit || 0);
        document.getElementById('blocking').textContent = sev.blocking || 0;
        document.getElementById('warnings').textContent = sev.warning || 0;
        document.getElementById('nits').textContent = sev.nit || 0;
        document.getElementById('pattern-rejections').textContent = stats.total_rejection_count ?? 0;
        const tbody = document.getElementById('reviews');
        tbody.innerHTML = reviews.map(r =>
          `<tr><td>${r.pr_reference}</td><td>${r.comment_count}</td><td>${r.created_at || '-'}</td></tr>`
        ).join('') || '<tr><td colspan="3">No reviews yet</td></tr>';
      } catch (e) {
        document.getElementById('reviews').innerHTML = '<tr><td colspan="3">Error loading data</td></tr>';
      }
    }
    load();
  </script>
</body>
</html>
